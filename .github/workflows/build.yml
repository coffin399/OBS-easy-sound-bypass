name: build-windows

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.7.*
          host: windows
          target: desktop
          arch: win64_msvc2019_64

      - name: Clone and configure obs-studio
        shell: bash
        run: |
          set -e
          git clone --branch 30.2.3 --depth 1 --recursive https://github.com/obsproject/obs-studio.git
          cd obs-studio
          OVERRIDE_DIR="${GITHUB_WORKSPACE//\\//}/cmake/Overrides"
          cmake -S . -B build_x64 -G "Visual Studio 17 2022" -A x64 -DCMAKE_SYSTEM_VERSION=10.0 \
            -DCMAKE_MODULE_PATH="${OVERRIDE_DIR}" \
            -DENABLE_SCRIPTING=OFF \
            -DENABLE_NEW_MPEGTS_OUTPUT=OFF \
            -DENABLE_AJA=OFF \
            -Dnlohmann_json_DIR="${OVERRIDE_DIR}" \
            -DLibDataChannel_DIR="${OVERRIDE_DIR}"

      - name: Build obs-studio (libobs, frontend)
        shell: bash
        run: |
          set -e
          cd obs-studio
          cmake --build build_x64 --config Release

      - name: Copy obs-frontend-api header into plugin source
        shell: bash
        run: |
          set -e
          OBS_SRC_ROOT="${GITHUB_WORKSPACE}/obs-studio"
          cp "$OBS_SRC_ROOT/UI/obs-frontend-api/obs-frontend-api.h" "${GITHUB_WORKSPACE}/src/obs-frontend-api.h"

      - name: Configure plugin CMake
        shell: bash
        run: |
          set -e
          OBS_SRC_ROOT="${GITHUB_WORKSPACE}/obs-studio"
          cmake -S . -B build -G "Visual Studio 17 2022" \
            -DOBS_INCLUDE_DIR="$OBS_SRC_ROOT/libobs" \
            -DOBS_FRONTEND_INCLUDE_DIR="$OBS_SRC_ROOT/UI/obs-frontend-api" \
            -DOBS_LIB_DIR="$OBS_SRC_ROOT/build_x64/libobs" \
            -DOBS_FRONTEND_LIB_DIR="$OBS_SRC_ROOT/build_x64/UI/obs-frontend-api" \
            -DOBS_CONFIG_DIR="$OBS_SRC_ROOT/build_x64/config" \
            -DCMAKE_CXX_FLAGS="/I$OBS_SRC_ROOT/libobs /I$OBS_SRC_ROOT/UI/obs-frontend-api /I$OBS_SRC_ROOT/build_x64/config"

      - name: Build
        run: cmake --build build --config Release

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: easy-sound-bypass-windows
          path: build/Release/easy-sound-bypass.dll

      - name: Create or update GitHub Release (latest)
        if: github.event_name == 'push'
        uses: ncipollo/release-action@v1
        with:
          tag: latest
          name: Easy Sound Bypass (latest)
          artifacts: build/Release/easy-sound-bypass.dll
          artifactContentType: application/octet-stream
          allowUpdates: true
          replacesArtifacts: true
          token: ${{ secrets.GITHUB_TOKEN }}
