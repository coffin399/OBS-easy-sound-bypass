name: build-windows

on:
  push:
    branches: [ main, master ]
  pull_request:

env:
  # 事前に用意した OBS dev パッケージ(zip)のURL
  # (include/lib をまとめたものを自分でホスティングしてください)
  OBS_DEV_URL: https://example.com/obs-dev-windows.zip

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.7.*
          host: windows
          target: desktop
          arch: win64_msvc2019_64

      - name: Download OBS dev package
        shell: bash
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/obs-dev"
          echo "Downloading OBS dev package from $OBS_DEV_URL"
          curl -L "$OBS_DEV_URL" -o obs-dev.zip
          unzip -q obs-dev.zip -d "$RUNNER_TEMP/obs-dev"

      - name: Configure CMake
        shell: bash
        run: |
          set -e
          OBS_DEV_ROOT="$RUNNER_TEMP/obs-dev/obs-dev"
          cmake -S . -B build -G "Visual Studio 17 2022" \
            -DOBS_INCLUDE_DIR="$OBS_DEV_ROOT/include/libobs" \
            -DOBS_FRONTEND_INCLUDE_DIR="$OBS_DEV_ROOT/include/obs-frontend-api" \
            -DOBS_LIB_DIR="$OBS_DEV_ROOT/lib" \
            -DOBS_FRONTEND_LIB_DIR="$OBS_DEV_ROOT/lib"

      - name: Build
        run: cmake --build build --config Release

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: easy-sound-bypass-windows
          path: build/Release/easy-sound-bypass.dll

      - name: Create or update GitHub Release (latest)
        if: github.event_name == 'push'
        uses: ncipollo/release-action@v1
        with:
          tag: latest
          name: Easy Sound Bypass (latest)
          artifacts: build/Release/easy-sound-bypass.dll
          artifactContentType: application/octet-stream
          allowUpdates: true
          replacesArtifacts: true
          token: ${{ secrets.GITHUB_TOKEN }}
